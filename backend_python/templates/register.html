<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 4rem;">
    <div class="card" style="text-align: center;">
      <h2 style="color: #1e3a8a;">PocketSmart</h2>
      <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem;">AI-Powered Budget Planning</p>
      
      <h3 style="margin-bottom: 1rem;">Create Your Account</h3>
      <form action="/register" method="post">
        <div class="form-group" style="text-align: left;">
          <label>Username</label>
          <input type="text" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group" style="text-align: left;">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group" style="text-align: left;">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a strong password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Create Account &plus;</button>
      </form>
      <p style="font-size: 0.8rem; margin-top: 1rem;">
        Already have an account? <a href="/login" style="color: #2563eb;">Sign In</a>
      </p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container" style="max-width: 420px; margin-top: 5rem;">
    <div class="card" style="text-align: center;">
      <h2 style="color: #1e3a8a;">PocketSmart</h2>
      <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 1.5rem;">AI-Powered Budget Planning</p>
      
      <h3 style="margin-bottom: 1rem;">Welcome Back</h3>
      <form action="/login" method="post">
        <div class="form-group" style="text-align: left;">
          <label>Username</label>
          <input type="text" name="username" value="sai" required>
        </div>
        <div class="form-group" style="text-align: left;">
          <label>Password</label>
          <input type="password" name="password" value="password123" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In &rarr;</button>
      </form>
      <p style="font-size: 0.8rem; margin-top: 1rem;">
        Don't have an account? <a href="/register" style="color: #2563eb;">Create Account</a>
      </p>
    </div>
  </div>
</body>
</html>
